services:
  mysql:
    image: mysql:8.4
    container_name: fc25-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./MySQL/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
      - fc25-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fc25-mysql-data:
